server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /ws { proxy_pass http://malar:8000; proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s; }
  location /api/ {
    proxy_pass http://malar:8000/;
    proxy_read_timeout 600s;      # LLM agent-generation calls can take minutes on local models
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
