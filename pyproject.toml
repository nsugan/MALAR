[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malar"
version = "3.0.0.dev0"
description = "MALAR — Multi-scale Adaptive Learning with Abstraction and Recall (local, agentic)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MALAR" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.2",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "openai>=1.30",
  "neo4j>=5.18",
  "qdrant-client>=1.9",
  "langgraph>=0.0.40",
  "scikit-learn>=1.4",
  "ripser>=0.6",
  "persim>=0.3",
  "POT>=0.9",
]

[project.optional-dependencies]
# Heavy / GPU-leaning extras. Installed in the malar container image.
ml = [
  "torch>=2.2",
  "torch-geometric>=2.5",
  "giotto-tda>=0.6",
  "emcee>=3.1",
]
dev = ["pytest>=8.0", "ruff>=0.4", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["malar*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
