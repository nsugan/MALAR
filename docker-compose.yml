services:
  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]

  ollama:
    image: ollama/ollama:latest          # newest Ollama (re-pin once a good version is found)
    ports: ["11434:11434"]
    volumes: ["ollama_models:/root/.ollama"]
    gpus: all                            # explicit NVIDIA passthrough (== docker run --gpus all)
    environment:
      - OLLAMA_KEEP_ALIVE=-1             # keep the model resident in VRAM (no reload latency)
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:                              # fallback for older compose that ignores `gpus:`
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable      # maintained stable tag (v1.80.0 was not published)
    depends_on: [ollama]
    env_file: [.env]
    ports: ["4000:4000"]
    volumes: ["./infra/litellm_config.yaml:/app/config.yaml:ro"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  malar:                                  # FastAPI: engine + control plane
    build: .
    depends_on: [neo4j, qdrant, litellm]
    env_file: [.env]
    environment:
      - AGENT_DB_PATH=/var/lib/malar/agents/agent_memory.sqlite   # generated-agent store
    ports: ["8000:8000"]
    volumes:
      - "./:/app"
      - "agent_db:/var/lib/malar/agents"  # dedicated volume for the SQLite agent memory
                                          # (real fs -> no bind-mount SQLite locking issues)

  webapp:
    build: ./ui
    depends_on: [malar]
    ports: ["3000:80"]

volumes:
  neo4j_data: {}
  qdrant_data: {}
  ollama_models: {}
  agent_db: {}
